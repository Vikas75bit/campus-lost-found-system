services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lostfound_postgres
    environment:
      POSTGRES_DB: lost_found_db
      POSTGRES_USER: lostfound_user
      POSTGRES_PASSWORD: lostfound_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/02_triggers_procedures.sql:/docker-entrypoint-initdb.d/02_triggers_procedures.sql
      - ./database/03_views.sql:/docker-entrypoint-initdb.d/03_views.sql
      - ./database/04_seed.sql:/docker-entrypoint-initdb.d/04_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lostfound_user -d lost_found_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lostfound_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://lostfound_user:lostfound_password@db:5432/lost_found_db
      - SECRET_KEY=university_lost_and_found_super_secret_jwt_key_2026_docker
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - HOST=0.0.0.0
      - PORT=8000
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    container_name: lostfound_web
    depends_on:
      - backend
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
